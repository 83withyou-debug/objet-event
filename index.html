      { name: '꼬임 매듭', word: '단단히 이어 가는', path: TW, tails: '' },
      { name: '심플 매듭', word: '담백하고 가볍게', path: 'M0,-8 a8,8 0 1,0 0.01,0 Z', tails: '' },
      { name: '포인트 매듭', word: '나를 또렷하게', path: 'M0,-12 L12,0 L0,12 L-12,0 Z', tails: '' }
    ];
    const CLOVER = 'M-5.5,-6 a5.5,5.5 0 1,0 11,0 a5.5,5.5 0 1,0 -11,0 Z M0.5,0 a5.5,5.5 0 1,0 11,0 a5.5,5.5 0 1,0 -11,0 Z M-5.5,6 a5.5,5.5 0 1,0 11,0 a5.5,5.5 0 1,0 -11,0 Z M-11.5,0 a5.5,5.5 0 1,0 11,0 a5.5,5.5 0 1,0 -11,0 Z';
    const STAR = 'M0,-14 L4.1,-4.3 L13.3,-4.3 L5.9,1.6 L8.7,11.3 L0,5.5 L-8.7,11.3 L-5.9,1.6 L-13.3,-4.3 L-4.1,-4.3 Z';
    const CHARMS = [
      { name: '별', word: '꿈 · 바람', path: STAR, rule: 'nonzero', glyph: '' },
      { name: '달', word: '위로 · 쉼', path: 'M4,-13 A13,13 0 1,0 4,13 A14,14 0 0,1 4,-13 Z', rule: 'nonzero', glyph: '' },
      { name: '하트', word: '사랑 · 다정함', path: 'M0,12 C-14,2 -14,-10 -6,-11 C-2,-11.5 0,-8 0,-6 C0,-8 2,-11.5 6,-11 C14,-10 14,2 0,12 Z', rule: 'nonzero', glyph: '' },
      { name: '클로버', word: '행운', path: CLOVER, rule: 'nonzero', glyph: '' },
      { name: '원형 링', word: '연결 · 순환', path: 'M0,-12 a12,12 0 1,0 0.01,0 Z M0,-7 a7,7 0 1,1 -0.01,0 Z', rule: 'evenodd', glyph: '' },
      { name: '이니셜', word: '나다움', path: 'M0,-12 a16,16 0 1,0 0.01,0 Z', rule: 'nonzero', glyph: 'A' },
      { name: '오행 심볼', word: '균형 · 조화', path: 'M0,-13 L12.4,-4 L7.6,10.5 L-7.6,10.5 L-12.4,-4 Z M0,-5 a5,5 0 1,0 0.01,0 Z', rule: 'evenodd', glyph: '' },
      { name: '장식 없음', word: '미니멀하게', path: '', rule: 'nonzero', glyph: '—' }
    ];
    const dot = (hex) => 'width:24px;height:24px;border-radius:50%;flex:none;background:' + hex + ';box-shadow:inset 0 0 0 1px rgba(42,34,36,0.25)';
    const colorItems = (l) => l.map((x) => Object.assign({}, x, { isColor: true, isIcon: false, dot: dot(x.hex) }));
    const iconItems = (l, fill) => l.map((x) => Object.assign({ tails: '', rule: 'nonzero', glyph: '' }, x, { isColor: false, isIcon: true, iconFill: fill }));
    const PARTS = [
      { id: 'cord', no: '01', label: '줄 컬러', en: 'The cord', unit: '컬러', source: '사주 · 오행',
        connect: '태어난 날의 오행(목·화·토·금·수) 균형을 살펴, 2027년의 나에게 채워 주면 좋을 기운을 줄의 색으로 옮겨요. 매일 손목에 두르는 가장 넓은 부분이라, 한 해의 바탕이 되는 기운을 담아요.',
        example: '예) 차분한 물(水)의 기운이 필요한 사람이라면 → 네이비', items: colorItems(CORDS), x: 9, y: 47 },
      { id: 'stone', no: '02', label: '원석', en: 'The stone', unit: '원석', source: 'ID 검사 · 나의 모양',
        connect: '나의 ID(IDENTITY) 검사로 본 나의 모양과, 2026년을 지나오며 흔들렸던 마음을 살펴요. 그 마음 곁에 두면 힘이 되어 줄 원석을 팔찌 가운데에 엮어요.',
        example: '예) 나다움을 찾고 새 출발을 앞둔 사람이라면 → 문스톤', items: colorItems(STONES), x: 70, y: 86 },
      { id: 'knot', no: '03', label: '매듭', en: 'The knot', unit: '매듭', source: 'ID 검사 · 관계의 방식',
        connect: '사람과 관계를 맺고 마음을 다루는 나만의 방식을 매듭으로 표현해요. 단단히 묶어 지키는 사람인지, 유연하게 풀어 가는 사람인지에 따라 달라져요.',
        example: '예) 변화를 즐기고 가능성을 보는 성향이라면 → 슬라이딩 매듭', items: iconItems(KNOTS, '#B8322F'), x: 70, y: 8 },
      { id: 'charm', no: '04', label: '참 장식', en: 'The charm', unit: '참', source: '나의 2027 소원',
        connect: '신청서에 적어 주신 2027년의 소원을 하나의 상징으로 담아 팔찌 끝에 매달아요. 손목을 볼 때마다 내가 바라던 것을 떠올리게 해 줘요.',
        example: '예) “조금 더 나를 믿고 싶어요” → 별', items: iconItems(CHARMS, '#C9A86A'), x: 30, y: 92 }
    ];
    const cur = PARTS.find((p) => p.id === s.part) || PARTS[0];
    const op = (id) => (s.part === id ? '1' : '0.18');
    const pinBase = 'position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;font:inherit;font-family:\'Playfair Display\',serif;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 12px rgba(110,40,50,0.25);';
    const tabBase = 'min-height:48px;padding:0 12px;border-radius:999px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;';
    return {
      pins: PARTS.map((p) => {
        const on = p.id === s.part;
        return { no: p.no.slice(1), aria: p.label + ' 설명 보기', pressed: on ? 'true' : 'false', pick: () => this.setState({ part: p.id }),
          style: pinBase + 'left:' + p.x + '%;top:' + p.y + '%;' + (on ? 'background:#B8322F;color:#FFFBF7;border:2px solid #FFFBF7;' : 'background:#FFFBF7;color:#B8322F;border:2px solid #B8322F;') };
      }),
      tabs: PARTS.map((p) => {
        const on = p.id === s.part;
        return { no: p.no, label: p.label, pressed: on ? 'true' : 'false', pick: () => this.setState({ part: p.id }),
          style: tabBase + (on ? 'background:#2A2224;color:#FFFBF7;border:1.5px solid #2A2224;' : 'background:#FFFDFB;color:#2A2224;border:1.5px solid #E2C6CA;') };
      }),
      p: cur,
      cordOp: op('cord'), stoneOp: op('stone'), knotOp: op('knot'), charmOp: op('charm'),
      cordHex: '#B5302E',
      stoneHex: '#E27F97',
      stoneHalo: s.part === 'stone' ? '1' : '0',
      knotPath: KNOTS[0].path,
      knotTails: KNOTS[0].tails,
      charmPath: STAR,
      charmRule: 'nonzero',
      charmLineOpacity: '1',
      initialR: '0',
      initialText: '',
      heroSlides: [HERO[s.heroIdx]],
      heroDots: HERO.map((h, i) => ({ aria: (i + 1) + '번째 팔찌 보기', pressed: s.heroIdx === i ? 'true' : 'false', pick: () => this.goHero(i),
        dot: 'display:block;height:7px;border-radius:999px;transition:width .25s;' + (s.heroIdx === i ? 'width:20px;background:#B8322F;' : 'width:7px;background:#D9B9BE;') })),
      heroSwipeStart: (e) => { this.hx = e.clientX; },
      heroSwipeEnd: (e) => { if (this.hx == null) return; const dx = e.clientX - this.hx; this.hx = null; if (Math.abs(dx) > 40) this.goHero(this.state.heroIdx + (dx < 0 ? 1 : -1)); },
      isCase1: s.caseIdx === 0,
      isCase2: s.caseIdx === 1,
      isCase3: s.caseIdx === 2,
      prevCase: () => this.setState({ caseIdx: (s.caseIdx + 2) % 3 }),
      nextCase: () => this.setState({ caseIdx: (s.caseIdx + 1) % 3 }),
      caseDots: [0, 1, 2].map((i) => ({ aria: ['CASE 01', 'CASE 02', 'CASE 03'][i] + ' 보기', pressed: s.caseIdx === i ? 'true' : 'false', pick: () => this.setState({ caseIdx: i }),
        style: 'height:10px;border:0;padding:0;border-radius:999px;cursor:pointer;transition:width .25s;' + (s.caseIdx === i ? 'width:28px;background:#B8322F;' : 'width:10px;background:#D9B9BE;') })),
      swipeStart: (e) => { this.sx = e.clientX; },
      swipeEnd: (e) => {
        if (this.sx == null) return;
        const dx = e.clientX - this.sx; this.sx = null;
        if (Math.abs(dx) > 40) this.setState({ caseIdx: (this.state.caseIdx + (dx < 0 ? 1 : 2)) % 3 });
      },
      submitted: s.submitted,
      notSubmitted: !s.submitted,
      thanksTitle: (s.applicant ? s.applicant + '님의 ' : '') + '소원이 도착했어요',
      submit: (e) => window.objetSubmit(e, this),
      reset: () => this.setState({ submitted: false, applicant: '' })
    };
  }
}


(function () {
  var tpl = document.getElementById('tpl').content, rootT = tpl.firstElementChild;
  dcComp = new Component({});
  var vals = dcComp.renderVals();
  var root = document.importNode(rootT, false);
  rootT.childNodes.forEach(function (c) {
    var el = dcBuild(c, vals); if (!el) return;
    root.appendChild(el);
    if (c.nodeType === 1) dcRegions.push({ t: c, el: el, dyn: c.outerHTML.indexOf('{{') > -1, form: !!c.querySelector('form') });
  });
  document.getElementById('app').replaceWith(root);
  if (dcComp.componentDidMount) dcComp.componentDidMount();
})();
</script>
